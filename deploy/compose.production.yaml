x-models: &models
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b-instruct}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-300}
  MODEL_CONTEXT_SIZE: ${MODEL_CONTEXT_SIZE:-4096}
  MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
  MODEL_CONCURRENCY: ${MODEL_CONCURRENCY:-1}
  STORAGE_DIR: /data

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production database password}
      POSTGRES_DB: rag_db
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U rag_owner -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: rag-api-production
    build: ../backend
    command: ["python","migrate.py"]
    volumes:
      - originals:/data
    environment:
      MIGRATION_DATABASE_URL: postgresql://rag_owner:${POSTGRES_PASSWORD}@db:5432/rag_db
      STORAGE_DIR: /data
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: rag-api-production
    build: ../backend
    command: ["uvicorn","main:app","--host","0.0.0.0","--port","8000","--workers","2"]
    environment:
      <<: *models
      RAW_DATABASE_URL: postgresql://rag_app:${APP_DB_PASSWORD}@db:5432/rag_db
      AUTH_SECRET: ${AUTH_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set the public HTTPS origin}
      COOKIE_SECURE: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      APP_ORIGIN: ${PUBLIC_ORIGIN}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-rag-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${PUBLIC_ORIGIN}/api/auth/sso/callback
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      REQUIRE_WARM_MODEL: ${REQUIRE_WARM_MODEL:-false}
    volumes:
      - originals:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

  worker:
    image: rag-api-production
    build: ../backend
    command: ["python","-u","worker.py"]
    environment:
      <<: *models
      RAW_DATABASE_URL: postgresql://rag_worker:${WORKER_DB_PASSWORD}@db:5432/rag_db
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-50}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
    volumes:
      - originals:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  mailer:
    image: rag-api-production
    command: ["python","-u","mailer.py"]
    environment:
      RAW_DATABASE_URL: postgresql://rag_app:${APP_DB_PASSWORD}@db:5432/rag_db
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: "true"
      SMTP_FROM: ${SMTP_FROM:-noreply@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  frontend:
    image: rag-web-production
    build:
      context: ../frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend,frontend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../.secrets.production/metrics_token:/run/secrets/metrics_token:ro
      - monitoring:/prometheus
    restart: unless-stopped

volumes:
  database:
  originals:
  monitoring:
