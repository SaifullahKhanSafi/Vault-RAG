name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  guard:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      revision: ${{ steps.version.outputs.revision }}
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          python3 tools/version.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          revision=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$revision" "origin/$DEFAULT_BRANCH"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
  validate:
    name: Release validation
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    name: Publish / ${{ matrix.component }}
    needs: [guard, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.guard.outputs.image_tag }}
            ${{ steps.image.outputs.name }}:sha-${{ needs.guard.outputs.revision }}
          build-args: |
            APP_VERSION=${{ needs.guard.outputs.version }}
            VCS_REF=${{ needs.guard.outputs.revision }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-release
      - name: Check the published immutable runtime
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          if [[ "$COMPONENT" == backend ]]; then
            test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = 10001
            docker run --rm --network none --read-only --entrypoint python "$IMAGE" -c "import sys; from app_version import VERSION; assert VERSION==sys.argv[1]" "$VERSION"
          else
            test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = 1000
            docker run --rm --network none --read-only --entrypoint node "$IMAGE" -e "if(require('/app/package.json').version !== process.argv[1]) process.exit(1)" "$VERSION"
          fi
      - name: Retain immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: printf '%s' "$DIGEST" > "$RUNNER_TEMP/$COMPONENT.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}.digest
          if-no-files-found: error
          retention-days: 7
  assets:
    name: Publish checked release bundle
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PRERELEASE: ${{ needs.guard.outputs.prerelease }}
      RELEASE_REVISION: ${{ needs.guard.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Package and verify immutable images
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          python tools/package_release.py --output dist --registry "ghcr.io/${GITHUB_REPOSITORY,,}" --revision "$RELEASE_REVISION" --backend-digest "$(cat "$RUNNER_TEMP/digests/backend.digest")" --frontend-digest "$(cat "$RUNNER_TEMP/digests/frontend.digest")"
          python tools/verify_release.py dist --tag "$GITHUB_REF_NAME" --revision "$RELEASE_REVISION" --registry "ghcr.io/${GITHUB_REPOSITORY,,}" --require-deployable --check-compose
      - name: Create GitHub release
        run: |
          python3 -c "from pathlib import Path; v=Path('VERSION').read_text().strip(); text=Path('CHANGELOG.md').read_text(); Path('release-notes.md').write_text(text.split('## ['+v+']',1)[1].split('\n## ',1)[0].strip())"
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Enterprise RAG $GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
