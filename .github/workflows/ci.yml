name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    name: Version consistency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: python3 tools/version.py --check --github-output "$GITHUB_OUTPUT"

  backend:
    name: Backend tests and audit
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r backend/requirements.lock
      - run: python tools/setup_env.py
      - run: docker compose config --quiet
      - name: Deployment shell syntax and validation
        run: |
          bash -n deploy/remote_deploy.sh
          bash deploy/remote_deploy.sh /opt/rag-ci 0.1.0 "$(printf 'a%.0s' {1..64})" staging --dry-run

  frontend:
    name: Frontend and browser tests
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  workflows:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and run pinned actionlint
        run: |
          if ! command -v shellcheck > /dev/null; then sudo apt-get update && sudo apt-get install -y shellcheck; fi
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
          shellcheck deploy/remote_deploy.sh

  images:
    name: Container / ${{ matrix.component }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          target: runtime
          load: true
          tags: rag-ci:${{ matrix.component }}
          build-args: |
            APP_VERSION=${{ needs.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}-ci
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-ci
      - name: Check backend runtime boundaries
        if: matrix.component == 'backend'
        run: |
          test "$(docker run --rm --entrypoint id rag-ci:backend -u)" = 10001
          docker run --rm --network none --read-only --entrypoint python rag-ci:backend -c "from pathlib import Path; from app_version import VERSION; assert VERSION; assert not any(Path('/app', name).exists() for name in ('.env', 'venv', 'tests', 'reset_db.py'))"
      - name: Check frontend runtime boundaries
        if: matrix.component == 'frontend'
        run: |
          test "$(docker run --rm --entrypoint id rag-ci:frontend -u)" = 1000
          docker run --rm --network none --read-only --entrypoint node rag-ci:frontend -e "const fs=require('fs'); if(!fs.existsSync('/app/server.js') || fs.existsSync('/app/.env')) process.exit(1)"

  packaging:
    name: Release packaging
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: Build preview packages (no publishing)
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          python tools/package_release.py --output dist --registry "ghcr.io/${GITHUB_REPOSITORY,,}" --revision "$(git rev-parse HEAD)"
          python tools/verify_release.py dist --check-compose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Fresh-database integration
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      jaeger:
        image: jaegertracing/jaeger:2.22.0
        ports: ["4318:4318"]
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ["1025:1025", "8025:8025"]
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: securepassword
          POSTGRES_DB: rag_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag_user -d rag_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://rag_user:securepassword@localhost:5432/rag_db
      RAW_DATABASE_URL: postgresql://rag_app:ci-app-password-test-only@localhost:5432/rag_db
      APP_DB_PASSWORD: ci-app-password-test-only
      WORKER_DB_PASSWORD: ci-worker-password-test-only
      BOOTSTRAP_ADMIN_EMAIL: admin@localhost
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password-test-only
      AUTH_SECRET: ci-auth-secret-not-for-production-012345678901234567890123456789
      METRICS_TOKEN: ci-metrics-token-test-only
      OLLAMA_BASE_URL: http://localhost:11435
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
      STORAGE_DIR: /tmp/rag-ci-originals
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      ALLOW_REGISTRATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r backend/requirements.lock
      - run: python backend/migrate.py
      - name: Start protocol test services
        run: |
          python tools/fake_ollama.py > /tmp/model.log 2>&1 &
          (cd backend && python -m uvicorn main:app --host 127.0.0.1 --port 8000) > /tmp/api.log 2>&1 &
          (cd backend && RAW_DATABASE_URL=postgresql://rag_worker:ci-worker-password-test-only@localhost:5432/rag_db python worker.py) > /tmp/worker.log 2>&1 &
          (cd backend && python mailer.py) > /tmp/mail.log 2>&1 &
          python tools/wait_ready.py
      - run: python -u backend/smoke_test.py
      - run: python -u tools/test_registration.py
      - name: Respect the real login/account rate window between suites
        run: sleep 61
      - run: python -u tools/test_enterprise_features.py
      - name: Test service logs on failure
        if: failure()
        run: cat /tmp/api.log /tmp/worker.log /tmp/model.log /tmp/mail.log

  required:
    name: Required checks
    if: always()
    needs: [metadata, backend, frontend, workflows, images, packaging, integration]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: python3 -c "import json,os; results=json.loads(os.environ['RESULTS']); assert all(job['result']=='success' for job in results.values()), results"
