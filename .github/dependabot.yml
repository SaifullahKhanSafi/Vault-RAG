version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 has no compiler API compatible with the current typescript-eslint.
      # Revisit when upstream lint support is available and validated.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      react-runtime:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
      react-runtime-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
